name: Publish

on:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from release tag
        run: |
          VERSION="${TAG_NAME#v}"
          echo "Setting package.json version to ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run check-types

      - name: Bundle
        run: node esbuild.js

      - name: Compile tests
        run: npm run compile-tests

      - name: Run unit tests
        run: npm run test:unit

      - name: Run VS Code integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out "oci-layout-explorer-${VERSION}.vsix"

      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce publish --packagePath "oci-layout-explorer-${VERSION}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG_NAME}" "oci-layout-explorer-${VERSION}.vsix" --clobber --repo "${GITHUB_REPOSITORY}"
